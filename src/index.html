<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' app:; img-src 'self' app: data: blob:; media-src 'self' app: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>ClipNova</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Home -->
  <div id="home" class="screen">
    <header class="home-top">
      <div class="brand"><span class="logo"></span>ClipNova</div>
      <button id="btn-support-home" class="support-btn">☕ Apoiar</button>
      <label class="lang">🌐 <span>Idioma do aplicativo</span> <select id="lang-select" data-noi18n></select></label>
    </header>
    <main class="home-main">
      <section class="hero">
        <button id="btn-new" class="new-card">
          <span class="plus">+</span>
          <span class="t">Novo projeto</span>
          <span class="s">Importe vídeos, fotos e áudio para começar</span>
        </button>
      </section>
      <section>
        <div class="section-head"><h2>Projetos</h2><span id="draft-count" class="muted"></span></div>
        <div id="drafts" class="drafts"></div>
      </section>
    </main>
  </div>

  <!-- Editor -->
  <div id="editor" class="screen hidden">
    <header class="topbar">
      <button id="btn-home" class="icon-btn" title="Início"></button>
      <div class="brand small"><span class="logo"></span></div>
      <input id="proj-name" class="proj-name" spellcheck="false">
      <span id="save-state" class="muted save-state"></span>
      <div class="grow"></div>
      <button id="btn-support" class="icon-btn support-ico" title="Apoie o ClipNova">☕</button>
      <button id="btn-tour" class="icon-btn" title="Tour guiado"></button>
      <button id="btn-undo" class="icon-btn" title="Desfazer (Ctrl+Z)"></button>
      <button id="btn-redo" class="icon-btn" title="Refazer (Ctrl+Y)"></button>
      <button id="btn-export" class="primary"><span class="ico"></span>Exportar</button>
    </header>

    <div class="workspace" id="workspace">
      <aside class="library">
        <nav id="lib-tabs" class="lib-tabs"></nav>
        <div id="lib-panel" class="lib-panel"></div>
      </aside>

      <section class="viewer">
        <div class="viewer-head"><span>Reprodutor</span><div class="grow"></div><span id="viewer-info" class="muted"></span></div>
        <div id="stage" class="stage">
          <div id="canvas-wrap" class="canvas-wrap">
            <canvas id="preview"></canvas>
            <div id="guides"></div>
            <div id="selbox" class="selbox hidden">
              <div class="h nw" data-h="scale"></div><div class="h ne" data-h="scale"></div>
              <div class="h sw" data-h="scale"></div><div class="h se" data-h="scale"></div>
              <div class="rot" data-h="rotate"></div>
            </div>
          </div>
          <div id="drop-hint" class="drop-hint hidden">Solte os arquivos para importar</div>
        </div>
        <div class="transport">
          <span id="tc" class="tc">00:00:00 / 00:00:00</span>
          <div class="grow center">
            <button id="btn-prev" class="icon-btn" title="Início"></button>
            <button id="btn-play" class="play-btn" title="Reproduzir (Espaço)"></button>
            <button id="btn-next" class="icon-btn" title="Fim"></button>
          </div>
          <select id="ratio-select" title="Proporção"></select>
          <button id="btn-full" class="icon-btn" title="Tela cheia"></button>
        </div>
      </section>

      <aside class="inspector" id="inspector"></aside>
    </div>

    <div class="splitter" id="splitter"></div>

    <div class="tl-wrap">
      <div class="tl-toolbar" id="tl-toolbar"></div>
      <div class="tl-scroll" id="tl-scroll">
        <div class="tl-content" id="tl-content">
          <div class="tl-ruler-row"><div class="tl-head-spacer"></div><canvas id="tl-ruler"></canvas></div>
          <div id="tl-rows" class="tl-rows"></div>
          <div id="tl-playhead" class="tl-playhead"><div class="knob"></div></div>
          <div id="tl-insert" class="tl-insert hidden"></div>
          <div id="tl-snap" class="tl-snap hidden"></div>
        </div>
      </div>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toasts"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
